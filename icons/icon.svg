<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fe0cc"/><stop offset="1" stop-color="#10a896"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe17a"/><stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- bolle decorative -->
  <circle cx="96" cy="92" r="70" fill="#fff" opacity=".14"/>
  <circle cx="440" cy="440" r="96" fill="#000" opacity=".06"/>
  <!-- ombra -->
  <ellipse cx="256" cy="392" rx="132" ry="18" fill="#063f38" opacity=".28"/>
  <g stroke="#1f2a2a" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- retro della cartella con linguetta -->
    <path d="M132 176 q0-22 22-22 h62 q12 0 20 9 l16 17 h106 q22 0 22 22 v150 q0 20-20 20 h-208 q-20 0-20-20 z" fill="#f59f1c"/>
    <!-- foglio che spunta -->
    <rect x="170" y="186" width="172" height="84" rx="12" fill="#fff"/>
    <!-- davanti della cartella -->
    <path d="M118 238 q0-18 18-18 h240 q18 0 16 18 l-14 118 q-2 20-22 20 h-200 q-20 0-22-20 z" fill="url(#front)"/>
  </g>
  <!-- nota musicale -->
  <g fill="#1f2a2a">
    <path d="M232 262 l70-16 v74 a20 17 -12 1 1 -12-16 v-36 l-46 10 v48 a20 17 -12 1 1 -12-16 z"/>
  </g>
  <!-- riflesso sul davanti -->
  <path d="M146 246 h70" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  <!-- scintille -->
  <g fill="#fff">
    <path d="M392 128 l7 18 18 7 -18 7 -7 18 -7-18 -18-7 18-7z"/>
    <path d="M114 300 l4 10 10 4 -10 4 -4 10 -4-10 -10-4 10-4z" opacity=".9"/>
  </g>
</svg>
